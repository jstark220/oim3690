<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Interests</title>
    <style>
        body {
            margin: 40px;
            font-family: Arial, sans-serif;
        }
        
        h1 {
            color: navy;
        }

        h2 {
            color: gray;
        }

        button {
            color: white;
            padding: 10px 20px;
            border: none;
        }

        .myelement {
            background-color: lightblue;
            transition: background-color 0.5s;
        }

        .myelement:hover {
            background-color: lightgreen;
        }
    </style>
</head>
<body>

    <h1>My Interests</h1>
    <p>Here are some things I enjoy.</p>

    <div>
        <h2>Tennis</h2>
        <button class="myelement">Tennis</button>
        <p>I love playing tennis. My favorite player is Rafael Nadal.</p>
    </div>

    <div>
        <h2>Business</h2>
        <p>I study business at Babson College.</p>
    </div>

    <div>
        <h2>Technology</h2>
        <p>I enjoy learning about web development and technology.</p>
    </div>

</body>
</html>
