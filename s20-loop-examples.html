<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <label for="rating">Rating:</label>
    <input type="number" id="rating" name="rating" min="0" max="5" value="3">
    <button onclick="updateStars()">Update Stars</button>
    <div id="stars"></div>

    <script>
        function updateStars() {
            const rating = document.querySelector('#rating').value;
            const container = document.querySelector('#stars');
            let stars = '';

            for (let i = 0; i < 5; i++) {
                if (i < rating) {
                    stars += '★';
                } else {
                    stars += '☆';
                }
            }
            container.textContent = stars;
        }

        const rating = 3;
        const container = document.querySelector('#stars');
        let stars = '';

        for (let i = 0; i < 5; i++) {
            if (i < rating) {
                stars += '★';
            } else {
                stars += '☆';
            }
        }
        container.textContent = stars; // ★★★☆☆
    </script>
</body>
</html>
